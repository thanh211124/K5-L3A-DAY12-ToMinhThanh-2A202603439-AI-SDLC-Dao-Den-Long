<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <link rel="stylesheet" href="./style.css" />
  <script type="importmap">
    { "imports": { "three": "/node_modules/three/build/three.module.js" } }
  </script>
</head>
<body>
  <!-- HUD (layout required by Ticket-02) -->
  <div id="hud" class="hidden">
    <div id="flames"></div>
    <div id="timer">5:00</div>
    <div id="topRight"><div>Đèn <b id="lit">0/5</b></div><div>Điểm <b id="score">0</b></div></div>
    <div id="prompt"></div>
    <div id="moteBar"></div><div id="carried"></div>
    <div id="cds">
      <div class="cd" id="cdDash"><span>Lướt</span><kbd>Shift</kbd></div>
      <div class="cd" id="cdPulse"><span>Tỏa Sáng</span><kbd>F</kbd></div>
    </div>
    <div id="arrow">➤</div>
    <div id="windWarn">Gió sắp nổi…</div>
    <div id="charmBadge"></div>
  </div>
  <div id="fps"></div>

  <!-- Screens -->
  <div id="screen" class="overlay"><div class="card" id="card"></div></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
