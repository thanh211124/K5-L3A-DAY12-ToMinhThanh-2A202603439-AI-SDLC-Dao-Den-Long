<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Đảo Đèn Lồng</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1028; font-family: system-ui, "Segoe UI", sans-serif; color: #ffe9c4; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; right: 12px; display: flex; gap: 10px; flex-wrap: wrap; pointer-events: none; }
    .chip { background: rgba(14, 18, 44, .72); border: 1px solid rgba(255, 179, 71, .35); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: 15px; }
    .chip b { color: #ffb347; }
    #flames .on { color: #ffb347; } #flames .off { color: #4a3d66; }
    #pulse.cd { opacity: .5; }
    #prompt { position: fixed; bottom: 70px; width: 100%; text-align: center; font-size: 18px; text-shadow: 0 0 8px #000; pointer-events: none; }
    #help { position: fixed; bottom: 12px; left: 12px; font-size: 13px; opacity: .75; pointer-events: none; }
    #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(8, 10, 30, .72); }
    #overlay.hidden { display: none; }
    .card { max-width: 520px; margin: 16px; text-align: center; background: rgba(20, 24, 58, .95); border: 1px solid #ffb347; border-radius: 16px; padding: 24px 28px; }
    .card h1 { margin: 0 0 8px; color: #ffb347; }
    .card p { line-height: 1.5; }
    .card kbd { background: #2a2f5e; border-radius: 4px; padding: 1px 6px; }
    #compass { position: fixed; top: 64px; left: 50%; transform: translateX(-50%); font-size: 14px; pointer-events: none; }
  </style>
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div class="chip" id="flames"></div>
    <div class="chip">Đom đóm <b id="carried">0</b></div>
    <div class="chip">Đèn <b id="lit">0/5</b></div>
    <div class="chip">Đêm còn <b id="time">5:00</b></div>
    <div class="chip">Điểm <b id="score">0</b></div>
    <div class="chip" id="pulse">Tỏa sáng [F]</div>
  </div>
  <div id="compass"></div>
  <div id="prompt"></div>
  <div id="help">WASD đi · Chuột kéo / ← → xoay camera · Space nhảy · E nạp đèn · F tỏa sáng · M tắt tiếng · R chơi lại</div>
  <div id="overlay"><div class="card" id="card"></div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
